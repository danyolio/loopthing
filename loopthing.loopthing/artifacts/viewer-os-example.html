<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LoopThing Package Browser Example</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      grid-template-columns: 240px 1fr;
      background: #f6f6f2;
      color: #191917;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    nav {
      padding: 18px;
      border-right: .5px solid rgba(0,0,0,.24);
      background: #ededE7;
    }
    main { padding: 32px; }
    button {
      width: 100%;
      margin-bottom: 8px;
      padding: 9px 10px;
      border: .5px solid rgba(0,0,0,.2);
      border-radius: 6px;
      background: white;
      text-align: left;
      font: inherit;
    }
    pre {
      white-space: pre-wrap;
      padding: 16px;
      border: .5px solid rgba(0,0,0,.22);
      background: white;
    }
  </style>
</head>
<body>
  <nav>
    <button data-file="START.md">START.md</button>
    <button data-file="investigations/user-input-track-changes.md">track changes</button>
    <button data-file="artifacts/slides/the-missing-artifact.html">slide</button>
  </nav>
  <main>
    <h1 id="title">START.md</h1>
    <pre id="content">A .loopthing package starts with a sanitized prompt.</pre>
  </main>
  <script>
    const files = {
      "START.md": "A .loopthing package starts with the best version of the project prompt.",
      "investigations/user-input-track-changes.md": "Track user input changes line by line. This is the process spine.",
      "artifacts/slides/the-missing-artifact.html": "Artifacts travel with the thinking loop."
    };
    document.querySelectorAll("button").forEach(button => {
      button.addEventListener("click", () => {
        document.getElementById("title").textContent = button.dataset.file;
        document.getElementById("content").textContent = files[button.dataset.file];
      });
    });
  </script>
</body>
</html>
