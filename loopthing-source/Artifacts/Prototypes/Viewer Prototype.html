<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LoopThing Package Browser Example</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      grid-template-columns: 240px 1fr;
      background: #f6f6f2;
      color: #191917;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    nav {
      padding: 18px;
      border-right: .5px solid rgba(0,0,0,.24);
      background: #edede7;
    }
    main { padding: 32px; }
    button {
      width: 100%;
      margin-bottom: 8px;
      padding: 9px 10px;
      border: .5px solid rgba(0,0,0,.2);
      border-radius: 6px;
      background: white;
      text-align: left;
      font: inherit;
    }
    pre {
      white-space: pre-wrap;
      padding: 16px;
      border: .5px solid rgba(0,0,0,.22);
      background: white;
    }
  </style>
</head>
<body>
  <nav>
    <button data-file="Prompts/Master Prompt.md">Master Prompt</button>
    <button data-file="Prompts/Follow Ups.md">Follow Ups</button>
    <button data-file="Generated Explainers/Problem Statement.md">Problem Statement</button>
    <button data-file="Thinking/Journey Map.md">Journey Map</button>
    <button data-file="Artifacts/Slides/Problem Solution How It Works.html">Slides</button>
  </nav>
  <main>
    <h1 id="title">Master Prompt</h1>
    <pre id="content">A .loopthing container starts with the cleanest version of the project prompt.</pre>
  </main>
  <script>
    const files = {
      "Prompts/Master Prompt.md": "A .loopthing starts with the best version of the project prompt.",
      "Prompts/Follow Ups.md": "Follow-ups are first-class process primitives.",
      "Generated Explainers/Problem Statement.md": "LoopThing generates net new explainers from the session.",
      "Thinking/Journey Map.md": "The journey map shows how the idea got sharper.",
      "Artifacts/Slides/Problem Solution How It Works.html": "Artifacts travel inside the same container."
    };
    document.querySelectorAll("button").forEach(button => {
      button.addEventListener("click", () => {
        document.getElementById("title").textContent = button.dataset.file;
        document.getElementById("content").textContent = files[button.dataset.file];
      });
    });
  </script>
</body>
</html>
