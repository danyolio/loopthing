<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-label="LoopThing container cutaway">
  <rect width="1400" height="900" fill="#f7f6f1"/>
  <rect x="70" y="70" width="1260" height="760" rx="24" fill="#ffffff" stroke="#191917" stroke-opacity=".25"/>
  <text x="110" y="144" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="58" font-weight="760" fill="#191917">Inside one .loopthing file</text>
  <text x="112" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" fill="#6f706a">a rich PDF for AI work, with provenance and runnable artifacts</text>

  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="128" y="264" width="260" height="150" rx="18" fill="#e8f0ff" stroke="#356fd1"/>
    <text x="158" y="324" font-size="31" font-weight="750" fill="#244d91">Prompts</text>
    <text x="158" y="360" font-size="20" fill="#244d91">initial ask + follow-ups</text>

    <rect x="438" y="264" width="260" height="150" rx="18" fill="#fff7e6" stroke="#a96d12"/>
    <text x="468" y="324" font-size="31" font-weight="750" fill="#7c4e08">Thinking</text>
    <text x="468" y="360" font-size="20" fill="#7c4e08">branches, kills, reasons</text>

    <rect x="748" y="264" width="260" height="150" rx="18" fill="#efe9fb" stroke="#8058bd"/>
    <text x="778" y="324" font-size="31" font-weight="750" fill="#5d3c91">Explainers</text>
    <text x="778" y="360" font-size="20" fill="#5d3c91">problem, solution, context</text>

    <rect x="1058" y="264" width="214" height="150" rx="18" fill="#eaf8f1" stroke="#1d8f65"/>
    <text x="1088" y="324" font-size="31" font-weight="750" fill="#126748">Media</text>
    <text x="1088" y="360" font-size="20" fill="#126748">images and maps</text>

    <rect x="128" y="484" width="260" height="150" rx="18" fill="#f8eaea" stroke="#c8453e"/>
    <text x="158" y="544" font-size="31" font-weight="750" fill="#8b2b27">Drafts</text>
    <text x="158" y="580" font-size="20" fill="#8b2b27">rough versions preserved</text>

    <rect x="438" y="484" width="260" height="150" rx="18" fill="#eef1ef" stroke="#70716b"/>
    <text x="468" y="544" font-size="31" font-weight="750" fill="#4b4c48">Slides</text>
    <text x="468" y="580" font-size="20" fill="#4b4c48">presentation artifact</text>

    <rect x="748" y="484" width="260" height="150" rx="18" fill="#eaf8f1" stroke="#1d8f65"/>
    <text x="778" y="544" font-size="31" font-weight="750" fill="#126748">Prototype</text>
    <text x="778" y="580" font-size="20" fill="#126748">working demo inside</text>

    <rect x="1058" y="484" width="214" height="150" rx="18" fill="#191917" stroke="#191917"/>
    <text x="1088" y="544" font-size="31" font-weight="750" fill="#f7f6f1">Code</text>
    <text x="1088" y="580" font-size="20" fill="#d5d4ce">viewer repo</text>
  </g>

  <rect x="128" y="704" width="1144" height="54" rx="12" fill="#191917"/>
  <text x="158" y="740" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#f7f6f1">single container, many artifact types, one inherited thought process</text>
</svg>
